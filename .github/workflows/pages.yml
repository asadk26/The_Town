# Publishes the collection to GitHub Pages on every push to main.
#
# `enablement: true` turns Pages on via the API the first time this runs, so
# the site needs no visit to the repository settings to come up.
name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes one still in flight.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Everything is static except One More Room, which is TypeScript and
      # Three.js and has to be built. Its rules tests gate the deploy.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: one-more-room/package-lock.json

      - name: Test and build One More Room
        run: |
          npm ci --prefix one-more-room
          npm test --prefix one-more-room
          npm run build --prefix one-more-room

      # The site is the repo as it stands, with the built game in place of
      # its source folder.
      - name: Assemble the site
        run: |
          mkdir _site
          rsync -a --exclude .git --exclude _site --exclude one-more-room ./ _site/
          cp -r one-more-room/dist _site/one-more-room

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
